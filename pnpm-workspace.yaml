# sharp ships native binaries and needs its install script to run. Next pulls
# it in for image optimization; pnpm blocks build scripts unless listed here.
allowBuilds:
  sharp: true
  # Native resolver used by the ESLint import plugin.
  unrs-resolver: true

# Next 15.5.23 pins postcss 8.4.31 and sharp 0.34.5 internally, both of which
# carry open advisories. Both overrides stay within the same major.
overrides:
  postcss: ^8.5.26
  sharp: ^0.35.3
